name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev --legacy-peer-deps

      - name: Build extension
        run: npm run build

      - name: Package dist into zip
        run: |
          cd dist
          zip -r "../king-crackx-${GITHUB_REF_NAME}.zip" .
          cd ..
          ls -la "king-crackx-${GITHUB_REF_NAME}.zip"

      - name: Resolve release notes from changelog
        id: body
        run: |
          BODY="$(awk '/^## / { n++; if (n==2) exit } n==1 { print }' docs/changelog.md)"
          [ -z "$BODY" ] && BODY="${GITHUB_REF_NAME}"
          {
            echo "text<<RELEASE_BODY_EOF"
            echo "$BODY"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.body.outputs.text }}
          files: king-crackx-${{ github.ref_name }}.zip
